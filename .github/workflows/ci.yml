name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Vitest unit tests
        run: pnpm test
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=critical

  integration:
    name: API and MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: golden_memory_test
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

	    env:
	      TEST_DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/golden_memory_test
	      DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/golden_memory_test
	      NODE_ENV: test
	      APP_URL: http://localhost:3000
	      AWS_S3_BUCKET: golden-memory-test
	      AWS_REGION: us-east-1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply test database migrations
        run: pnpm drizzle-kit migrate

      - name: Run API and database integration tests
        run: pnpm test:integration
