<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM2部署方案</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #F2F7F4 0%, #E8F3ED 100%);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding-top: 50px;
            padding-left: 80px;
            padding-right: 80px;
        }
        .title {
            font-size: 48px;
            font-weight: 800;
            color: #1B4332;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #40916C;
            margin-bottom: 25px;
        }
        .content {
            flex: 1;
            padding: 0 80px 30px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        .feature-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #FF9F1C;
        }
        .feature-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(255, 159, 28, 0.1);
            border-radius: 6px;
            font-size: 18px;
            color: #FF9F1C;
            margin-bottom: 12px;
        }
        .feature-title {
            font-size: 16px;
            font-weight: 700;
            color: #1B4332;
            margin-bottom: 12px;
        }
        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .feature-item {
            font-size: 12px;
            color: #40916C;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feature-item i {
            color: #22C55E;
            font-size: 10px;
            width: 12px;
        }
        .command-box {
            background: rgba(27, 67, 50, 0.05);
            padding: 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #40916C;
            margin-top: 12px;
            line-height: 1.3;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="title">PM2部署方案</div>
            <div class="subtitle">应用进程管理和监控</div>
        </div>
        <div class="content">
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-icon"><i class="fas fa-tasks"></i></div>
                    <div class="feature-title">应用管理</div>
                    <div class="feature-list">
                        <div class="feature-item"><i class="fas fa-check"></i> 集群模式</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 自动重启</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 内存限制</div>
                    </div>
                </div>

                <div class="feature-card">
                    <div class="feature-icon"><i class="fas fa-chart-line"></i></div>
                    <div class="feature-title">监控告警</div>
                    <div class="feature-list">
                        <div class="feature-item"><i class="fas fa-check"></i> 实时监控</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 性能指标</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 日志管理</div>
                    </div>
                </div>

                <div class="feature-card">
                    <div class="feature-icon"><i class="fas fa-rocket"></i></div>
                    <div class="feature-title">部署工具</div>
                    <div class="feature-list">
                        <div class="feature-item"><i class="fas fa-check"></i> 零停机重启</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 自动回滚</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 版本管理</div>
                    </div>
                </div>
            </div>
            <div class="command-box">
pm2 start ecosystem.config.js --env production && pm2 startup && pm2 save
            </div>
        </div>
    </div>
</body>
</html>
