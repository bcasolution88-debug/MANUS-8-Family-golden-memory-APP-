<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全配置</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #F2F7F4 0%, #E8F3ED 100%);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding-top: 50px;
            padding-left: 80px;
            padding-right: 80px;
        }
        .title {
            font-size: 48px;
            font-weight: 800;
            color: #1B4332;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #40916C;
            margin-bottom: 25px;
        }
        .content {
            flex: 1;
            padding: 0 80px 30px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        .feature-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #FF9F1C;
        }
        .feature-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(255, 159, 28, 0.1);
            border-radius: 6px;
            font-size: 18px;
            color: #FF9F1C;
            margin-bottom: 12px;
        }
        .feature-title {
            font-size: 16px;
            font-weight: 700;
            color: #1B4332;
            margin-bottom: 12px;
        }
        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .feature-item {
            font-size: 12px;
            color: #40916C;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feature-item i {
            color: #22C55E;
            font-size: 10px;
            width: 12px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="title">安全配置</div>
            <div class="subtitle">多层次安全保障体系</div>
        </div>
        <div class="content">
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-icon"><i class="fas fa-shield-alt"></i></div>
                    <div class="feature-title">防火墙规则</div>
                    <div class="feature-list">
                        <div class="feature-item"><i class="fas fa-check"></i> SSH访问控制</div>
                        <div class="feature-item"><i class="fas fa-check"></i> HTTP允许</div>
                        <div class="feature-item"><i class="fas fa-check"></i> HTTPS允许</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 默认拒绝</div>
                    </div>
                </div>

                <div class="feature-card">
                    <div class="feature-icon"><i class="fas fa-lock"></i></div>
                    <div class="feature-title">数据安全</div>
                    <div class="feature-list">
                        <div class="feature-item"><i class="fas fa-check"></i> SSL/TLS加密</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 数据库加密</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 密码哈希</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 审计日志</div>
                    </div>
                </div>

                <div class="feature-card">
                    <div class="feature-icon"><i class="fas fa-key"></i></div>
                    <div class="feature-title">应用安全</div>
                    <div class="feature-list">
                        <div class="feature-item"><i class="fas fa-check"></i> 用户认证</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 权限控制</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 速率限制</div>
                        <div class="feature-item"><i class="fas fa-check"></i> 输入验证</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
