<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部署方式对比</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #F2F7F4 0%, #E8F3ED 100%);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding-top: 50px;
            padding-left: 80px;
            padding-right: 80px;
        }
        .title {
            font-size: 48px;
            font-weight: 800;
            color: #1B4332;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #40916C;
            margin-bottom: 30px;
        }
        .content {
            flex: 1;
            padding: 0 80px 40px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            overflow: hidden;
        }
        .comparison-table th {
            background: linear-gradient(90deg, #1B4332 0%, #40916C 100%);
            color: white;
            padding: 14px;
            text-align: left;
            font-weight: 700;
            font-size: 14px;
        }
        .comparison-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #E5E7EB;
            font-size: 13px;
            color: #40916C;
        }
        .comparison-table tr:last-child td {
            border-bottom: none;
        }
        .comparison-table tr:nth-child(even) {
            background: rgba(64, 145, 108, 0.03);
        }
        .method-name {
            font-weight: 700;
            color: #1B4332;
        }
        .check {
            color: #22C55E;
            font-weight: 700;
        }
        .cross {
            color: #EF4444;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="title">部署方式对比</div>
            <div class="subtitle">三种主流部署方案对比分析</div>
        </div>
        <div class="content">
            <table class="comparison-table">
                <thead>
                    <tr>
                        <th>部署方式</th>
                        <th>隔离性</th>
                        <th>易用性</th>
                        <th>扩展性</th>
                        <th>适用场景</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="method-name">Docker Compose</td>
                        <td><span class="check">✓ 优秀</span></td>
                        <td><span class="check">✓ 简单</span></td>
                        <td><span class="check">✓ 优秀</span></td>
                        <td>大规模、多环境</td>
                    </tr>
                    <tr>
                        <td class="method-name">PM2</td>
                        <td><span class="cross">✗ 一般</span></td>
                        <td><span class="check">✓ 简单</span></td>
                        <td><span class="cross">✗ 有限</span></td>
                        <td>中小规模</td>
                    </tr>
                    <tr>
                        <td class="method-name">Nginx + Node</td>
                        <td><span class="cross">✗ 差</span></td>
                        <td><span class="cross">✗ 复杂</span></td>
                        <td><span class="cross">✗ 差</span></td>
                        <td>小规模</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
