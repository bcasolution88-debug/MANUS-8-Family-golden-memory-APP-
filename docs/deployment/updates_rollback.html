<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新和回滚</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #F2F7F4 0%, #E8F3ED 100%);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding-top: 50px;
            padding-left: 80px;
            padding-right: 80px;
        }
        .title {
            font-size: 48px;
            font-weight: 800;
            color: #1B4332;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #40916C;
            margin-bottom: 25px;
        }
        .content {
            flex: 1;
            padding: 0 80px 30px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .process-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .process-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #FF9F1C;
        }
        .process-title {
            font-size: 16px;
            font-weight: 700;
            color: #1B4332;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .process-title i {
            color: #FF9F1C;
        }
        .process-steps {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .step {
            font-size: 12px;
            color: #40916C;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: rgba(255, 159, 28, 0.1);
            border: 1px solid #FF9F1C;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            color: #FF9F1C;
            flex-shrink: 0;
        }
        .step-text {
            flex: 1;
        }
        .command {
            background: rgba(27, 67, 50, 0.05);
            padding: 4px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #40916C;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="title">更新和回滚</div>
            <div class="subtitle">安全的更新和快速恢复机制</div>
        </div>
        <div class="content">
            <div class="process-grid">
                <div class="process-card">
                    <div class="process-title">
                        <i class="fas fa-arrow-up"></i>
                        更新流程
                    </div>
                    <div class="process-steps">
                        <div class="step">
                            <div class="step-number">1</div>
                            <div class="step-text">
                                拉取最新代码
                                <span class="command">git pull origin main</span>
                            </div>
                        </div>
                        <div class="step">
                            <div class="step-number">2</div>
                            <div class="step-text">
                                构建应用
                                <span class="command">npm run build</span>
                            </div>
                        </div>
                        <div class="step">
                            <div class="step-number">3</div>
                            <div class="step-text">
                                重启服务
                                <span class="command">docker-compose restart app</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="process-card">
                    <div class="process-title">
                        <i class="fas fa-undo"></i>
                        回滚方案
                    </div>
                    <div class="process-steps">
                        <div class="step">
                            <div class="step-number">✓</div>
                            <div class="step-text">Git版本控制</div>
                        </div>
                        <div class="step">
                            <div class="step-number">✓</div>
                            <div class="step-text">Docker镜像标签</div>
                        </div>
                        <div class="step">
                            <div class="step-number">✓</div>
                            <div class="step-text">数据库备份</div>
                        </div>
                        <div class="step">
                            <div class="step-number">✓</div>
                            <div class="step-text">快速恢复机制</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
