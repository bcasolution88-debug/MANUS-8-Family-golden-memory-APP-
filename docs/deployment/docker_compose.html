<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Compose配置</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #F2F7F4 0%, #E8F3ED 100%);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding-top: 50px;
            padding-left: 80px;
            padding-right: 80px;
        }
        .title {
            font-size: 48px;
            font-weight: 800;
            color: #1B4332;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #40916C;
            margin-bottom: 25px;
        }
        .content {
            flex: 1;
            padding: 0 80px 30px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .service-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #FF9F1C;
        }
        .service-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(255, 159, 28, 0.1);
            border-radius: 6px;
            font-size: 18px;
            color: #FF9F1C;
            margin-bottom: 12px;
        }
        .service-title {
            font-size: 16px;
            font-weight: 700;
            color: #1B4332;
            margin-bottom: 12px;
        }
        .service-features {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .feature {
            font-size: 12px;
            color: #40916C;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feature i {
            color: #22C55E;
            font-size: 10px;
            width: 12px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="title">Docker Compose配置</div>
            <div class="subtitle">完整的服务组成</div>
        </div>
        <div class="content">
            <div class="services-grid">
                <div class="service-card">
                    <div class="service-icon"><i class="fas fa-cube"></i></div>
                    <div class="service-title">应用服务</div>
                    <div class="service-features">
                        <div class="feature"><i class="fas fa-check"></i> Node.js应用容器</div>
                        <div class="feature"><i class="fas fa-check"></i> 自动重启机制</div>
                        <div class="feature"><i class="fas fa-check"></i> 健康检查</div>
                    </div>
                </div>

                <div class="service-card">
                    <div class="service-icon"><i class="fas fa-database"></i></div>
                    <div class="service-title">数据库服务</div>
                    <div class="service-features">
                        <div class="feature"><i class="fas fa-check"></i> PostgreSQL 15</div>
                        <div class="feature"><i class="fas fa-check"></i> 数据持久化</div>
                        <div class="feature"><i class="fas fa-check"></i> 自动备份</div>
                    </div>
                </div>

                <div class="service-card">
                    <div class="service-icon"><i class="fas fa-bolt"></i></div>
                    <div class="service-title">缓存服务</div>
                    <div class="service-features">
                        <div class="feature"><i class="fas fa-check"></i> Redis 7</div>
                        <div class="feature"><i class="fas fa-check"></i> 内存缓存</div>
                        <div class="feature"><i class="fas fa-check"></i> 持久化存储</div>
                    </div>
                </div>

                <div class="service-card">
                    <div class="service-icon"><i class="fas fa-shield-alt"></i></div>
                    <div class="service-title">反向代理</div>
                    <div class="service-features">
                        <div class="feature"><i class="fas fa-check"></i> Nginx Alpine</div>
                        <div class="feature"><i class="fas fa-check"></i> SSL/TLS支持</div>
                        <div class="feature"><i class="fas fa-check"></i> 负载均衡</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
