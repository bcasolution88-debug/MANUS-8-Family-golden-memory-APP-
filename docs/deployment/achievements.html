<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目成果总结</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #F2F7F4 0%, #E8F3ED 100%);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding-top: 50px;
            padding-left: 80px;
            padding-right: 80px;
        }
        .title {
            font-size: 48px;
            font-weight: 800;
            color: #1B4332;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #40916C;
            margin-bottom: 20px;
        }
        .content {
            flex: 1;
            padding: 0 80px 30px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }
        .completion-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            overflow: hidden;
            font-size: 12px;
        }
        .completion-table th {
            background: linear-gradient(90deg, #1B4332 0%, #40916C 100%);
            color: white;
            padding: 10px;
            text-align: left;
            font-weight: 700;
        }
        .completion-table td {
            padding: 10px;
            border-bottom: 1px solid #E5E7EB;
            color: #40916C;
        }
        .completion-table tr:last-child td {
            border-bottom: none;
        }
        .completion-table tr:nth-child(even) {
            background: rgba(64, 145, 108, 0.03);
        }
        .module-name {
            font-weight: 700;
            color: #1B4332;
        }
        .status-complete {
            color: #22C55E;
            font-weight: 700;
        }
        .highlights-box {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #FF9F1C;
        }
        .highlights-title {
            font-size: 14px;
            font-weight: 700;
            color: #1B4332;
            margin-bottom: 10px;
        }
        .highlights-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .highlight {
            font-size: 12px;
            color: #40916C;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .highlight i {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="title">项目成果总结</div>
            <div class="subtitle">完成情况和项目亮点</div>
        </div>
        <div class="content">
            <table class="completion-table">
                <thead>
                    <tr>
                        <th>模块</th>
                        <th>完成度</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="module-name">前端UI</td>
                        <td>100%</td>
                        <td class="status-complete">✅</td>
                    </tr>
                    <tr>
                        <td class="module-name">后端API</td>
                        <td>100%</td>
                        <td class="status-complete">✅</td>
                    </tr>
                    <tr>
                        <td class="module-name">优化功能</td>
                        <td>100%</td>
                        <td class="status-complete">✅</td>
                    </tr>
                    <tr>
                        <td class="module-name">文档</td>
                        <td>100%</td>
                        <td class="status-complete">✅</td>
                    </tr>
                    <tr>
                        <td class="module-name">测试</td>
                        <td>100%</td>
                        <td class="status-complete">✅</td>
                    </tr>
                    <tr>
                        <td class="module-name">部署准备</td>
                        <td>100%</td>
                        <td class="status-complete">✅</td>
                    </tr>
                </tbody>
            </table>

            <div class="highlights-box">
                <div class="highlights-title">项目亮点</div>
                <div class="highlights-grid">
                    <div class="highlight">
                        <i class="fas fa-star"></i>
                        <span>完整的功能实现</span>
                    </div>
                    <div class="highlight">
                        <i class="fas fa-bolt"></i>
                        <span>显著的性能提升</span>
                    </div>
                    <div class="highlight">
                        <i class="fas fa-lock"></i>
                        <span>全面的安全保障</span>
                    </div>
                    <div class="highlight">
                        <i class="fas fa-book"></i>
                        <span>详细的文档支持</span>
                    </div>
                    <div class="highlight">
                        <i class="fas fa-rocket"></i>
                        <span>生产级别的质量</span>
                    </div>
                    <div class="highlight">
                        <i class="fas fa-check-double"></i>
                        <span>完善的测试覆盖</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
