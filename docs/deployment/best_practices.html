<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最佳实践</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #F2F7F4 0%, #E8F3ED 100%);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding-top: 50px;
            padding-left: 80px;
            padding-right: 80px;
        }
        .title {
            font-size: 48px;
            font-weight: 800;
            color: #1B4332;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #40916C;
            margin-bottom: 25px;
        }
        .content {
            flex: 1;
            padding: 0 80px 30px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .practices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        .practice-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #FF9F1C;
        }
        .practice-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(255, 159, 28, 0.1);
            border-radius: 6px;
            font-size: 18px;
            color: #FF9F1C;
            margin-bottom: 12px;
        }
        .practice-title {
            font-size: 16px;
            font-weight: 700;
            color: #1B4332;
            margin-bottom: 12px;
        }
        .practice-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .practice-item {
            font-size: 12px;
            color: #40916C;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .practice-item i {
            color: #22C55E;
            font-size: 10px;
            width: 12px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="title">最佳实践</div>
            <div class="subtitle">开发、部署和运维规范</div>
        </div>
        <div class="content">
            <div class="practices-grid">
                <div class="practice-card">
                    <div class="practice-icon"><i class="fas fa-code"></i></div>
                    <div class="practice-title">开发规范</div>
                    <div class="practice-list">
                        <div class="practice-item"><i class="fas fa-check"></i> 代码审查</div>
                        <div class="practice-item"><i class="fas fa-check"></i> 自动化测试</div>
                        <div class="practice-item"><i class="fas fa-check"></i> CI/CD流程</div>
                        <div class="practice-item"><i class="fas fa-check"></i> 版本管理</div>
                    </div>
                </div>

                <div class="practice-card">
                    <div class="practice-icon"><i class="fas fa-rocket"></i></div>
                    <div class="practice-title">部署规范</div>
                    <div class="practice-list">
                        <div class="practice-item"><i class="fas fa-check"></i> 蓝绿部署</div>
                        <div class="practice-item"><i class="fas fa-check"></i> 灰度发布</div>
                        <div class="practice-item"><i class="fas fa-check"></i> 自动回滚</div>
                        <div class="practice-item"><i class="fas fa-check"></i> 健康检查</div>
                    </div>
                </div>

                <div class="practice-card">
                    <div class="practice-icon"><i class="fas fa-tools"></i></div>
                    <div class="practice-title">运维规范</div>
                    <div class="practice-list">
                        <div class="practice-item"><i class="fas fa-check"></i> 监控告警</div>
                        <div class="practice-item"><i class="fas fa-check"></i> 日志管理</div>
                        <div class="practice-item"><i class="fas fa-check"></i> 备份恢复</div>
                        <div class="practice-item"><i class="fas fa-check"></i> 安全审计</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
